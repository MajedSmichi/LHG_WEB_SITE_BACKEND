name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────── Test & Code Quality ───────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
        continue-on-error: true
      - run: npm test -- --passWithNoTests --coverage
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_BACKEND }}
            -Dsonar.sources=src
            -Dsonar.exclusions=src/generated/**,src/**/*.spec.ts
            -Dsonar.coverage.inclusions=src/app.service.ts,src/auth/auth.service.ts,src/users/users.service.ts,src/conversations/conversations.service.ts,src/sentiment/sentiment.service.ts,src/mail/mail.service.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ─────────────── Build & Push Docker Images ───────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            majedsmichi/lhg-backend:latest
            majedsmichi/lhg-backend:${{ github.sha }}

      - name: Build & Push Sentiment Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sentiment
          push: true
          tags: |
            majedsmichi/lhg-sentiment:latest
            majedsmichi/lhg-sentiment:${{ github.sha }}

  # ─────────────── Deploy to EC2 ───────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 (Kubernetes)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Force pull new images and restart pods
            sudo kubectl set image deployment/backend backend=majedsmichi/lhg-backend:${{ github.sha }} -n lhg-production
            sudo kubectl set image deployment/sentiment sentiment=majedsmichi/lhg-sentiment:${{ github.sha }} -n lhg-production

            # Wait for rollout
            sudo kubectl rollout status deployment/backend -n lhg-production --timeout=120s
            sudo kubectl rollout status deployment/sentiment -n lhg-production --timeout=120s

            echo "✅ Backend + Sentiment deployed to K8s!"
