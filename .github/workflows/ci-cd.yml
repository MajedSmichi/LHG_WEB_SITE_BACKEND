name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────── Test ───────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
        continue-on-error: true
      - run: npm test -- --passWithNoTests
        continue-on-error: true

  # ─────────────── Build & Push Docker Images ───────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            majedsmichi/lhg-backend:latest
            majedsmichi/lhg-backend:${{ github.sha }}

      - name: Build & Push Sentiment Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sentiment
          push: true
          tags: |
            majedsmichi/lhg-sentiment:latest
            majedsmichi/lhg-sentiment:${{ github.sha }}

  # ─────────────── Deploy to EC2 ───────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull majedsmichi/lhg-backend:latest
            docker pull majedsmichi/lhg-sentiment:latest
            cd ~/LHG_WEB_SITE_BACKEND
            docker-compose up -d backend sentiment
            echo "✅ Backend deployed!"
